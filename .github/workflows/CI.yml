name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    outputs:
      # JSON array of packages to test
      packages: ${{ steps.select.outputs.packages }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        # One filter per package, adding a package doesn't require editing this file.
        filters: .github/package-filters.yml
    - uses: dorny/paths-filter@v4
      id: ci
      with:
        filters: |
          ci:
            - .github/workflows/CI.yml
    - name: Select packages to test
      id: select
      env:
        CHANGED: ${{ steps.filter.outputs.changes }}
        CI_CHANGED: ${{ steps.ci.outputs.ci }}
      run: |
        if [ "$CI_CHANGED" = "true" ]; then
          # The CI workflow itself changed, so test every package
          echo "packages=$(yq -o=json -I=0 'keys' .github/package-filters.yml)" >> "$GITHUB_OUTPUT"
        else
          echo "packages=$CHANGED" >> "$GITHUB_OUTPUT"
        fi
  test:
    name: Julia ${{ matrix.version }} - ${{matrix.package}} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    needs: changes
    # An empty package matrix is an error, so skip if no packages changed
    if: needs.changes.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        # Parse JSON array containing names of all filters matching any of changed files
        # e.g. ['package1', 'package2'] if both package folders contains changes
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest
        version:
          - '1.6'
          - 'pre'
        arch:
          - 'default'
          - 'x86'
        exclude:
          - os: macos-latest
            arch: 'x86'
          - os: ubuntu-24.04-arm
            arch: 'x86'
          - os: ubuntu-latest
            version: '1.6'
            arch: 'x86'
          - os: windows-latest
            version: '1.6'
          - os: macos-latest
            version: '1.6'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          show-versioninfo: true
          project: ${{matrix.package}}
      - uses: julia-actions/cache@v3
      - name: Run the tests
        shell: julia --color=yes {0}
        run: |
          @static if VERSION >= v"1.12"
            using Pkg
            Pkg.Registry.update()
            Pkg.activate("${{ matrix.package }}")
            Pkg.test()
          else
            using Pkg
            using TOML
            Pkg.Registry.update()
            Pkg.activate(;temp=true)
            # force it to use this PR's version of the package
            ENV["JULIA_PKG_DEVDIR"]= mktempdir()
            Pkg.develop(unique([
              (;path="${{ matrix.package }}"),
              (;path="ChunkCodecCore"),
              (;path="ChunkCodecTests"),
            ]))
            Pkg.update()
            Pkg.test(TOML.parsefile("${{ matrix.package }}/Project.toml")["name"]; coverage=true)
          end
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: ${{matrix.package}}/src
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # required
          files: lcov.info
